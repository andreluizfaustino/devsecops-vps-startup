# Configuração estática do Traefik
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Log de acesso em JSON, com o IP real do visitante (Cf-Connecting-Ip)
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        Cf-Connecting-Ip: keep
        Cf-Ipcountry: keep
        User-Agent: keep

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs: &cloudflare
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "108.162.192.0/18"
        - "131.0.72.0/22"
        - "141.101.64.0/18"
        - "162.158.0.0/15"
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "188.114.96.0/20"
        - "190.93.240.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "2400:cb00::/32"
        - "2405:8100::/32"
        - "2405:b500::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # Confia nos cabeçalhos X-Forwarded-* SÓ quando vêm da Cloudflare.
    # Faixas copiadas de /etc/cloudflare-ips.txt (mudam raramente; revisar 1x/ano).
    forwardedHeaders:
      trustedIPs: *cloudflare
    http:
      tls: {}
      # Proteções aplicadas a TODAS as aplicações publicadas
      middlewares:
        - default-secure@file
  dashboard:
    address: ":8080"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"   # sem docker.sock direto
    exposedByDefault: false      # só publica container com label traefik.enable=true
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true
